name: Build macOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build macOS app
      run: flutter build macos --release

    - name: Zip the app bundle
      run: |
        cd build/macos/Build/Products/Release/
        zip -r singlish_writer-macos.zip singlish_writer.app

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: singlish_writer-macos
        path: build/macos/Build/Products/Release/singlish_writer-macos.zip

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: "v1.0.${{ github.run_number }}"
        name: "Release v1.0.${{ github.run_number }}"
        files: build/macos/Build/Products/Release/singlish_writer-macos.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
