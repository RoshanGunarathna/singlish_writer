name: Build macOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build macOS app
      run: flutter build macos --release

    - name: Zip the app bundle
      run: |
        cd build/macos/Build/Products/Release/
        zip -r singlish_writer-macos.zip singlish_writer.app

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: singlish_writer-macos
        path: build/macos/Build/Products/Release/singlish_writer-macos.zip
